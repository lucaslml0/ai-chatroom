name = "muse-chatroom"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# 静态前端：public/ 由 Worker 优先接管 API/WS，其余交给 ASSETS
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[durable_objects]
bindings = [{ name = "CHATROOM", class_name = "ChatRoom" }]

# Workers AI：小管家 Moderator 只回 @Moderator 的消息
[ai]
binding = "AI"

# 每 2 分钟扫一次 @Moderator 的未回复消息（小管家）
# 每 1 分钟拉一次微信 iLink（微信桥 2026-11-09 并进本 Worker；旧独立 Worker
# ai-chatroom-wechat 的 Cron 已摘，名额从它那空出来——免费账号共 5 个）。
[triggers]
crons = ["*/2 * * * *", "* * * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
